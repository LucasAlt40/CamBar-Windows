name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # publishing the release on tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build CamBar.sln -c Release
      - name: Core checks
        run: dotnet run --project src/CamBar.Checks -c Release --no-build
      - name: Publish single-file executable
        run: dotnet publish src/CamBar.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: CamBar-win-x64
          path: publish/CamBar.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" publish/CamBar.exe
          --title "CamBar para Windows ${{ github.ref_name }}"
          --notes "Executável único e autocontido (não precisa do .NET). Requer o ffmpeg: winget install Gyan.FFmpeg. Primeira versão do port, ainda não testada em um Windows real."
